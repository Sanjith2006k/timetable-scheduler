<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 text-gray-800 flex h-screen overflow-hidden">
    <!-- Sidebar Toggle -->
    <input type="checkbox" id="menu-toggle" class="hidden peer" />

    <!-- Sidebar -->
    <aside
      class="fixed top-0 left-0 w-64 h-full bg-indigo-700 text-white transform -translate-x-full peer-checked:translate-x-0 transition-transform duration-300 z-40"
    >
      <div
        class="p-6 text-2xl font-bold border-b border-indigo-600 flex justify-between items-center"
      >
        Menu
        <label for="menu-toggle" class="cursor-pointer">✖</label>
      </div>
      <nav class="flex-1 p-4 space-y-2">
        <a
          href="{{ url_for('main.dashboard') }}"
          class="block px-4 py-2 rounded-md hover:bg-indigo-600"
          >Dashboard</a
        >
        <a
          href="{{ url_for('main.add_classroom') }}"
          class="block px-4 py-2 rounded-md hover:bg-indigo-600"
          >Classrooms</a
        >
        <a
          href="{{ url_for('main.add_faculty') }}"
          class="block px-4 py-2 rounded-md hover:bg-indigo-600"
          >Faculties</a
        >
        <a
          href="{{ url_for('main.add_subject') }}"
          class="block px-4 py-2 rounded-md hover:bg-indigo-600"
          >Subjects</a
        >

        <a
          href="{{ url_for('main.logout') }}"
          class="block bg-red-500 hover:bg-red-600 text-center px-4 py-2 rounded-md font-medium mt-4"
        >
          Logout
        </a>
      </nav>
    </aside>

    <!-- Overlay -->
    <label
      for="menu-toggle"
      class="fixed inset-0 bg-black bg-opacity-50 hidden peer-checked:block z-30"
    ></label>

    <!-- Main content -->
    <div class="flex-1 flex flex-col ml-0 md:ml-64">
      <!-- Top Bar -->
      <header
        class="shadow px-6 py-4 flex justify-between items-center"
        style="background-color: #f8f9fa; border-bottom: 1px solid #dee2e6"
      >
        <h2
          class="text-xl font-semibold"
          style="color: #212529 !important; font-weight: 600"
        >
          Welcome, {{ current_user.username }}
        </h2>
        <div class="flex items-center gap-3">
          <label
            for="menu-toggle"
            class="md:hidden cursor-pointer"
            style="
              background-color: #6366f1;
              color: white;
              padding: 8px 12px;
              border-radius: 6px;
            "
          >
            ☰
          </label>
        </div>
      </header>

      <!-- Page Content -->
      <main class="flex-1 p-8 overflow-y-auto">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
